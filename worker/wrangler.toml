name = "elite-cuts-api"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Storage: one D1 (SQLite) database. First-time setup for a new shop:
#   npx wrangler d1 create elite-cuts                        # paste the printed database_id below
#   npx wrangler d1 execute elite-cuts --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "elite-cuts"
database_id = "58a73f46-b18a-4209-a919-063a31aa4ca6"

[vars]
# Browser origins allowed to call this API (comma-separated). "https://*.x" also matches
# preview deploys like https://abc123.x. Add your custom domain here if you add one. "*" = any.
ALLOWED_ORIGINS = "https://elite-cuts-barbershop.app,https://elite-cuts-4qn.pages.dev,https://*.elite-cuts-4qn.pages.dev"
# Sender for the "your credit is back" email (only used once RESEND_API_KEY is set):
# EMAIL_FROM = "Elite Cuts <bookings@elite-cuts-barbershop.app>"

# Secrets (NOT stored here — set with `npx wrangler secret put <NAME>`):
#   MANAGER_PIN            required — PIN for /api/manager/login
#   STRIPE_WEBHOOK_SECRET  recommended — verifies signatures on /api/webhook/stripe
#   STRIPE_SECRET_KEY      a TEST key (sk_test_...) turns on Stripe Checkout (deposit, prepay, wallet top-ups);
#                          a live key is ignored unless STRIPE_ALLOW_LIVE = "true" is set as a var
#   RESEND_API_KEY         optional — emails a client when VIP wallet credit comes back (resend.com).
#                          Needs EMAIL_FROM too: uncomment it under [vars] above with an address on a
#                          domain you verified in Resend, e.g.
#                          EMAIL_FROM = "Elite Cuts <bookings@elite-cuts-barbershop.app>"
